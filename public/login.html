<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escritório dos agentes</title>
<link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/estilo.css">
</head>
<body>
<main class="login">
  <form id="form" autocomplete="on">
    <h1>Escritório dos agentes</h1>
    <p>Entre para ver o seu time trabalhando.</p>
    <label>Usuário<input name="usuario" autocomplete="username" required></label>
    <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
    <div class="erro" id="erro" role="alert"></div>
    <button type="submit">Entrar</button>
  </form>
</main>
<script src="/login.js"></script>
</body>
</html>
